<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가챠 투자 분석기</title>
    <link rel="stylesheet" href="style.css?v=20260823181945">
  </head>
  <body>
    <div class="app-layout">

      <!-- Mobile drawer toggle + backdrop -->
      <button id="menuToggle" class="menu-toggle" aria-label="메뉴">☰</button>
      <div id="navBackdrop" class="nav-backdrop"></div>

      <!-- Sidebar: always visible -->
      <aside class="sidebar">
        <div class="sidebar-title">가챠 투자 분석기</div>

        <!-- Game list -->
        <div class="sidebar-section">
          <div class="sidebar-section-label">게임 목록</div>
          <div id="gameList" class="game-list">
            <!-- populated by renderGameSelect() -->
          </div>
          <button id="addGameBtn" class="add-game-btn">+ 게임 추가</button>
        </div>

        <!-- Nav tabs -->
        <nav class="sidebar-nav">
          <button class="nav-tab active" data-tab="analysis">가챠 분석</button>
          <button class="nav-tab" data-tab="currency">보유 재화</button>
        </nav>

        <!-- Analysis side content (hidden when currency tab is active) -->
        <div id="analysisSideContent" class="sidebar-side-content">

          <!-- Owned character roster section (hidden, logic retained) -->
          <section class="roster-section" style="display:none;">
            <h2>보유 캐릭터 <span id="rosterCount" class="badge">0</span></h2>
            <div class="roster-wrap">
              <div id="rosterList" class="roster-list"></div>
            </div>
          </section>

        </div>
        <!-- Data update actions (moved to bottom) -->
        <div id="analysisActions" class="sidebar-actions">
          <button id="metaUpdateBtn" class="side-action-btn" disabled>메타 업데이트</button>
          <button id="cardSyncBtn" class="side-action-btn" disabled>카드 데이터 갱신</button>
        </div>
        <!-- Personal settings save/load -->
        <div class="sidebar-footer">
          <button class="sidebar-footer-btn" onclick="exportPersonalSettings()">저장</button>
          <button class="sidebar-footer-btn" onclick="importPersonalSettings()">불러오기</button>
          <button class="sidebar-footer-btn" id="logoutBtn">로그아웃</button>
        </div>

      </aside>

      <!-- Main content area -->
      <main class="main-content">

        <!-- Tab: 가챠 분석 -->
        <div id="tabAnalysis" class="tab-page">
          <section class="panel panel-right" id="resultsPanel" aria-label="분석 결과">
            <!--
              innerHTML set by:
              - renderResults(result)    → analysis output
              - renderNoMeta(character)  → no meta data message
              - renderPlaceholder(msg)   → idle/loading message
              - renderError(msg)         → error message
            -->
            <noscript><p style="padding:16px">JavaScript가 필요한 서비스입니다.</p></noscript>
          </section>
        </div>

        <!-- Tab: 현재 보유 재화 리스트 -->
        <div id="tabCurrency" class="tab-page" style="display:none;">
          <div id="currencyPage" class="currency-page">
            <!-- populated by renderCurrencyPage() -->
          </div>
        </div>

      </main>
    </div>

    <!-- Account Manager Modal -->
    <div id="charDetailModal" style="display:none;"></div>
    <!-- Character Manager Modal -->
    <div id="charEditModal" style="display:none;"></div>
    <!-- Game Config Modal -->
    <div id="gameConfigModal" style="display:none;"></div>
    <!-- Currency Config Modal -->
    <div id="currencyConfigModal" style="display:none;"></div>
    <!-- Pass Edit Modal -->
    <div id="passEditModal" style="display:none;"></div>
    <!-- Currency Ledger (receipt) Modal -->
    <div id="ledgerModal" style="display:none;"></div>

    <!-- Login gate (Supabase 계정) -->
    <div id="authGate" class="auth-gate">
      <form id="authForm" class="auth-box">
        <h1>가챠 투자 분석기</h1>
        <button type="button" id="authGoogle" class="auth-google">
          <svg class="auth-google-icon" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>Google 계정으로 로그인</span>
        </button>
        <div class="auth-or">또는 이메일로</div>
        <input id="authEmail" type="email" placeholder="이메일" autocomplete="username" required>
        <input id="authPassword" type="password" placeholder="비밀번호" autocomplete="current-password" required>
        <div class="auth-btns">
          <button type="submit" id="authLogin">로그인</button>
          <button type="button" id="authSignup">가입</button>
        </div>
        <div id="authError" class="auth-error"></div>
      </form>
    </div>

    <!-- Scripts: supabase auth first, then engine, then app -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js?v=20260823181945"></script>
    <script src="evaluationEngine.js?v=20260823181945"></script>
    <script src="app.js?v=20260823181945"></script>
  </body>
</html>
